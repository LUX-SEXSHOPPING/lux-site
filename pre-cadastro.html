<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Cadastro — LUX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --dourado: #c9a227;
            --dourado-claro: #e6c86e;
            --escuro: #0b0b0f;
            --fundo-card: rgba(20, 20, 28, 0.85);
            --texto-claro: #f8f5f7;
            --borda: rgba(201, 162, 39, 0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--escuro) url('banner.jpg') center/cover no-repeat fixed;
            color: var(--texto-claro);
            line-height: 1.6;
            padding: 2rem 1rem;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(circle at top, rgba(201,162,39,.15), transparent 55%),
                        rgba(11,11,15,.78);
            z-index: -1;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: var(--fundo-card);
            border-radius: 16px;
            padding: 2.2rem;
            border: 1px solid var(--borda);
            box-shadow: 0 10px 35px rgba(0,0,0,.4);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--dourado);
            text-align: center;
            margin-bottom: 0.4rem;
        }
        .sub { text-align: center; color: #c9c2c6; margin-bottom: 1.6rem; }
        label {
            display: block; margin: 1rem 0 .4rem;
            font-weight: 500; color: var(--dourado-claro);
        }
        input, select, textarea {
            width: 100%; padding: .85rem; border-radius: 8px;
            border: 1px solid var(--borda); background: rgba(0,0,0,.25);
            color: #fff; outline: none; transition: .2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--dourado); box-shadow: 0 0 0 4px rgba(201,162,39,.15); }
        button {
            width: 100%; padding: .95rem; margin-top: 1.4rem;
            background: linear-gradient(135deg, var(--dourado), #b08c1f);
            color: #000; font-weight: 600; border: none; border-radius: 10px;
            cursor: pointer; font-size: 1rem; transition: transform .2s, box-shadow .2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(201,162,39,.35); }
        .voltar {
            display: block; text-align: center; margin-top: 1.4rem;
            color: var(--dourado-claro); text-decoration: none; font-size: .95rem;
        }
        .voltar:hover { color: var(--dourado); }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-star"></i> Pré-Cadastro LUX</h1>
        <p class="sub">Preencha e envie diretamente pelo WhatsApp</p>

        <form id="formCadastro">
            <label>Nome / Apelido Profissional</label>
            <input type="text" id="nome" required>

            <label>Idade</label>
            <input type="number" id="idade" min="18" max="65" required>

            <label>Cidade / Estado</label>
            <input type="text" id="cidade" placeholder="ex.: Gravataí — RS" required>

            <label>WhatsApp / Telefone</label>
            <input type="tel" id="telefone" placeholder="com DDD, só números" required>

            <label>Sexo / Perfil</label>
            <select id="perfil" required>
                <option value="">Selecione</option>
                <option value="Feminino">Feminino</option>
                <option value="Masculino">Masculino</option>
            </select>

            <label>Descrição curta / Apresentação</label>
            <textarea id="descricao" rows="4" placeholder="Altura, características, disponibilidade..."></textarea>

            <button type="submit"><i class="fab fa-whatsapp"></i> Enviar para Análise</button>
        </form>

        <a href="index.html" class="voltar"><i class="fas fa-arrow-left"></i> Voltar ao Início</a>
    </div>

    <script>
        const SEU_NUMERO = "5551980612941"; // com código do país 55, sem + e sem espaços

        document.getElementById("formCadastro").addEventListener("submit", function(e) {
            e.preventDefault(); // impede recarregamento da página[[__LINK_ICON]](https://github.com/matheuscostadesign/enviar-para-whatsapp/?f_link_type=f_linkinlinenote&flow_extra=eyJpbmxpbmVfZGlzcGxheV9wb3NpdGlvbiI6MCwiZG9jX3Bvc2l0aW9uIjowLCJkb2NfaWQiOiI4YTdjNWY5Njg2ZTNlNTgxLTNmOWJjNTg5ZTdmMDg0MjMifQ%3D%3D "[__LINK_ICON]")

            // pega os campos
            const nome     = document.getElementById("nome").value.trim();
            const idade     = document.getElementById("idade").value;
            const cidade    = document.getElementById("cidade").value.trim();
            const telefone  = document.getElementById("telefone").value.trim();
            const perfil    = document.getElementById("perfil").value;
            const descricao = document.getElementById("descricao").value.trim() || "—";

            // monta a mensagem formatada como relatório
            const mensagem = `📋 *NOVO PRÉ-CADASTRO — LUX*
━━━━━━━━━━━━━━━
👤 *Nome/Apelido:* ${nome}
🎂 *Idade:* ${idade} anos
📍 *Cidade/UF:* ${cidade}
📞 *WhatsApp:* ${telefone}
⚧ *Perfil:* ${perfil}
📝 *Apresentação:*
${descricao}

━━━━━━━━━━━━━━━
Enviado do formulário de pré-cadastro LUX`;

            // codifica e abre o WhatsApp
            const url = `https://wa.me/${SEU_NUMERO}?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        });
    </script>
</body>
</html>
