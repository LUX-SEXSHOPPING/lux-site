<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página Não Encontrada | LUX</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700;1,800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --dourado:#c9a227;
  --dourado-claro:#f0d878;
  --champanhe:#f5e6c8;
  --texto-claro:#efe7dd;
  --texto-suave:#cbbfaf;
  --vinho:#6e0f2e;
  --fundo:#0c0809;
  --painel:rgba(255,255,255,.045);
  --borda-dourada:rgba(201,162,39,.28);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
  color:var(--texto-claro);
  min-height:100vh;
  background:
    radial-gradient(900px 520px at 82% -12%, rgba(110,15,46,.38), transparent 60%),
    radial-gradient(760px 420px at 8% 112%, rgba(201,162,39,.14), transparent 62%),
    var(--fundo);
}
.conteudo{
  position:relative;
  z-index:1;
  max-width:1120px;
  margin:0 auto;
  padding:0 22px
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:24px 0;
  flex-wrap:wrap;
  gap:16px;
}
.logo-header{
  display:flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
}
.logo-img{
  width:70px;
  height:70px;
  object-fit:contain;
  filter:brightness(1.3) saturate(1.4) drop-shadow(0 0 12px rgba(201,162,39,.5));
}
.logo-lux{
  font-family:'Playfair Display',serif;
  font-size:36px;
  font-weight:800;
  font-style:italic;
  letter-spacing:6px;
  color:var(--champanhe);
}
nav{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  justify-content:flex-end;
}
nav a{
  color:var(--texto-suave);
  text-decoration:none;
  padding:9px 14px;
  font-size:14px;
  letter-spacing:.6px;
  border:1px solid transparent;
  border-radius:999px;
  transition:all .3s;
  background:rgba(12,8,9,.6);
  backdrop-filter:blur(4px);
}
nav a:hover{
  color:var(--dourado-claro);
  border-color:var(--borda-dourada);
  background:rgba(201,162,39,.12);
}
.erro-box{
  text-align:center;
  padding:80px 20px;
  max-width:650px;
  margin:40px auto;
  background:rgba(255,255,255,.03);
  border:1px solid var(--borda-dourada);
  border-radius:24px;
  backdrop-filter:blur(10px);
}
.erro-codigo{
  font-family:'Playfair Display',serif;
  font-size:72px;
  font-weight:800;
  color:var(--dourado-claro);
  letter-spacing:4px;
  margin-bottom:10px;
}
.erro-titulo{
  font-family:'Playfair Display',serif;
  font-size:24px;
  color:var(--champanhe);
  margin-bottom:16px;
}
.erro-msg{
  color:var(--texto-suave);
  font-size:15px;
  line-height:1.7;
  margin-bottom:32px;
}
.botoes{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:12px 24px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  transition:all .3s;
}
.btn-ouro{
  background:linear-gradient(135deg,#f0d878,#c9a227 60%,#8a6d14);
  color:#1a1206;
}
.btn-ouro:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,162,39,.45)}
.btn-contorno{
  color:var(--dourado-claro);
  border:1px solid var(--borda-dourada);
  background:rgba(201,162,39,.06);
}
.btn-contorno:hover{background:rgba(201,162,39,.14);transform:translateY(-2px)}
</style>
<script>
(function(){
  var path = window.location.pathname.toLowerCase();
  if(path.indexOf('catal') !== -1){
    window.location.replace('catalago.html');
  } else if(path.indexOf('loja') !== -1 || path.indexOf('store') !== -1){
    window.location.replace('loja.html');
  } else if(path.indexOf('cadastro') !== -1){
    window.location.replace('pre-cadastro.html');
  } else if(path.indexOf('agenda') !== -1 || path.indexOf('espera') !== -1){
    window.location.replace('lista-espera.html');
  } else if(path.indexOf('termo') !== -1){
    window.location.replace('termos.html');
  }
})();
</script>
</head>
<body>
<div class="conteudo">
<header>
  <a href="index.html" class="logo-header">
    <img src="logo3.png" alt="LUX Logo" class="logo-img">
    <div class="logo-lux">LUX</div>
  </a>
  <nav>
    <a href="index.html">Início</a>
    <a href="loja.html">Loja</a>
    <a href="catalago.html">Catálogo</a>
    <a href="pre-cadastro.html">Pré-Cadastro</a>
    <a href="lista-espera.html">Agendar</a>
    <a href="index.html#sobre">Sobre</a>
    <a href="termos.html">Termos</a>
  </nav>
</header>
<main>
  <div class="erro-box">
    <div class="erro-codigo">404</div>
    <h1 class="erro-titulo">Página Não Encontrada</h1>
    <p class="erro-msg">O endereço acessado não existe ou foi movido. Use o menu acima ou os botões abaixo para continuar navegando no LUX.</p>
    <div class="botoes">
      <a href="catalago.html" class="btn btn-ouro"><i class="fas fa-gem"></i> Ir para o Catálogo</a>
      <a href="loja.html" class="btn btn-ouro"><i class="fas fa-shopping-bag"></i> Ir para a Loja</a>
      <a href="index.html" class="btn btn-contorno"><i class="fas fa-house"></i> Voltar ao Início</a>
    </div>
  </div>
</main>
</div>
</body>
</html>
